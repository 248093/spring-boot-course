# 应用服务 WEB 访问端口
server:
  port: 8085

spring:
  config:
    import: classpath:sms.properties
  redis:
    host: localhost
    port: 6379
    password: # 如果设置了密码，则填写密码
    database: 02 # Redis数据库索引（默认为0）
    jedis:
      pool:
        max-active: 8 # 连接池最大连接数（使用Jedis时）
        max-wait: -1ms # 连接池最大阻塞等待时间（使用Jedis时）
        max-idle: 8 # 连接池中的最大空闲连接（使用Jedis时）
        min-idle: 0 # 连接池中的最小空闲连接（使用Jedis时）
    lettuce:
      pool:
        max-active: 8 # 连接池最大连接数（使用Lettuce时）
        max-wait: -1ms # 连接池最大阻塞等待时间（使用Lettuce时）
        max-idle: 8 # 连接池中的最大空闲连接（使用Lettuce时）
        min-idle: 0 # 连接池中的最小空闲连接（使用Lettuce时）

lyh:
  sendMessage:
    serverPort: ${sms.server.port}
    accountSId: ${sms.account.sid}
    accountToken: ${sms.account.token}
    appId: ${sms.app.id}
    templateId: ${sms.template.id}